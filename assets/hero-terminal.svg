<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141C" />
      <stop offset="50%" stop-color="#131A26" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>

    <!-- Neon Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AA2F7" />
      <stop offset="30%" stop-color="#BB9AF7" />
      <stop offset="70%" stop-color="#7DCFFF" />
      <stop offset="100%" stop-color="#73DACA" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7AA2F7" />
      <stop offset="100%" stop-color="#7DCFFF" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BB9AF7" />
      <stop offset="100%" stop-color="#F7768E" />
    </linearGradient>

    <!-- Subtle Cyberpunk Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#7AA2F7" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.92); }
    }
    .cursor { animation: blink 1s infinite ease-in-out; }
    .live-dot { animation: pulseLive 2s infinite ease-in-out; transform-origin: 730px 42px; }
    .code-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13.5px; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Card Outer Glow & Border -->
  <rect x="2" y="2" width="836" height="396" rx="14" fill="none" stroke="url(#neonBorder)" stroke-width="1.8" stroke-opacity="0.85" filter="url(#glow)" />
  <rect x="2" y="2" width="836" height="396" rx="14" fill="url(#cardBg)" />
  <rect x="2" y="2" width="836" height="396" rx="14" fill="url(#cyberGrid)" />

  <!-- Window Header Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 824 2 Q 838 2 838 16 L 838 48 L 2 48 Z" fill="#161F2E" fill-opacity="0.95" />
  <line x1="2" y1="48" x2="838" y2="48" stroke="#7AA2F7" stroke-width="1" stroke-opacity="0.25" />

  <!-- Window Dots -->
  <circle cx="24" cy="25" r="6" fill="#FF5F56" />
  <circle cx="44" cy="25" r="6" fill="#FFBD2E" />
  <circle cx="64" cy="25" r="6" fill="#27C93F" />

  <!-- Window Title -->
  <text x="420" y="29" fill="#9AA5CE" font-size="12" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="1">
    duynamiq@cyberdeck: ~/workspace/manifesto (zsh)
  </text>

  <!-- Live Status Badge (Top Right) -->
  <rect x="650" y="14" width="170" height="22" rx="11" fill="#132F2B" stroke="#73DACA" stroke-width="1" stroke-opacity="0.5" />
  <circle cx="664" cy="25" r="4" fill="#73DACA" class="live-dot" />
  <text x="676" y="29" fill="#73DACA" font-size="10.5" font-weight="700" font-family="'Fira Code', monospace" letter-spacing="0.5">OPEN FOR PROJECTS</text>

  <!-- Terminal Content Body -->
  <!-- Command Prompt -->
  <g transform="translate(30, 82)">
    <text class="code-text" fill="#73DACA" font-weight="bold">❯</text>
    <text class="code-text" x="18" fill="#7AA2F7" font-weight="600">whoami</text>
    <text class="code-text" x="78" fill="#565F89">--role --stack --manifesto</text>
  </g>

  <!-- Info Grid Panel -->
  <g transform="translate(30, 110)">
    <!-- Row 1: Name & Alias -->
    <rect x="0" y="0" width="780" height="38" rx="8" fill="#162030" fill-opacity="0.6" stroke="#7AA2F7" stroke-width="0.8" stroke-opacity="0.2" />
    <text class="code-text" x="18" y="24" fill="#BB9AF7" font-weight="600">IDENTIFIER</text>
    <text class="code-text" x="150" y="24" fill="#E0AF68">Nguyen Dang Duy Le</text>
    <text class="code-text" x="320" y="24" fill="#565F89">|</text>
    <text class="code-text" x="340" y="24" fill="#7DCFFF">@DangDuyLe</text>
    <text class="code-text" x="440" y="24" fill="#565F89">aka</text>
    <text class="code-text" x="480" y="24" fill="#73DACA" font-weight="600">duynamiq</text>

    <!-- Row 2: Role & Mission -->
    <rect x="0" y="46" width="780" height="38" rx="8" fill="#162030" fill-opacity="0.6" stroke="#7AA2F7" stroke-width="0.8" stroke-opacity="0.2" />
    <text class="code-text" x="18" y="70" fill="#BB9AF7" font-weight="600">SPECIALTY</text>
    <text class="code-text" x="150" y="70" fill="#C0CAF5">Full-Stack Software Engineer</text>
    <text class="code-text" x="400" y="70" fill="#565F89">|</text>
    <text class="code-text" x="420" y="70" fill="#7AA2F7">Web Apps &amp; Scalable APIs</text>

    <!-- Row 3: Core Tech Arsenal -->
    <rect x="0" y="92" width="780" height="38" rx="8" fill="#162030" fill-opacity="0.6" stroke="#7AA2F7" stroke-width="0.8" stroke-opacity="0.2" />
    <text class="code-text" x="18" y="116" fill="#BB9AF7" font-weight="600">CORE ARSENAL</text>
    <text class="code-text" x="150" y="116" fill="#7DCFFF">TypeScript</text>
    <text class="code-text" x="245" y="116" fill="#565F89">•</text>
    <text class="code-text" x="265" y="116" fill="#61DAFB">React / Next.js</text>
    <text class="code-text" x="390" y="116" fill="#565F89">•</text>
    <text class="code-text" x="410" y="116" fill="#89D185">Node.js / Express</text>
    <text class="code-text" x="555" y="116" fill="#565F89">•</text>
    <text class="code-text" x="575" y="116" fill="#38BDF8">Tailwind CSS</text>

    <!-- Row 4: Portfolio URL -->
    <rect x="0" y="138" width="780" height="38" rx="8" fill="#162030" fill-opacity="0.6" stroke="#7AA2F7" stroke-width="0.8" stroke-opacity="0.2" />
    <text class="code-text" x="18" y="162" fill="#BB9AF7" font-weight="600">PORTFOLIO</text>
    <text class="code-text" x="150" y="162" fill="#2AC3DE" font-weight="bold">https://duynamiq.vercel.app</text>
    <text class="code-text" x="480" y="162" fill="#565F89">[Live Production]</text>

    <!-- Row 5: Engineering Creed / Quote -->
    <rect x="0" y="184" width="780" height="52" rx="8" fill="#1A182E" fill-opacity="0.8" stroke="#BB9AF7" stroke-width="1" stroke-opacity="0.4" />
    <text class="code-text" x="18" y="214" fill="#F7768E" font-weight="bold">CREED</text>
    <text class="code-text" x="150" y="206" fill="#A9B1D6" font-style="italic">"If it runs slow, profile &amp; optimize it. If it looks dull, elevate it."</text>
    <text class="code-text" x="150" y="226" fill="#73DACA" font-size="12">⚡ Committed to zero-compromise performance and pixel-perfect design.</text>
  </g>

  <!-- Active Prompt Line with Blinking Cursor -->
  <g transform="translate(30, 380)">
    <text class="code-text" fill="#73DACA" font-weight="bold">❯</text>
    <text class="code-text" x="18" fill="#7AA2F7">cat skills.json | grep &quot;READY_TO_BUILD&quot;</text>
    <rect x="360" y="-12" width="9" height="16" fill="#7AA2F7" class="cursor" />
  </g>
</svg>
