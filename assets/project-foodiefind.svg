<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="foodieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121824" />
      <stop offset="100%" stop-color="#0E131C" />
    </linearGradient>
    <linearGradient id="foodieGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9E3B" />
      <stop offset="100%" stop-color="#FF5D62" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7AA2F7" />
      <stop offset="100%" stop-color="#7DCFFF" />
    </linearGradient>
  </defs>

  <style>
    .font-code { font-family: 'Fira Code', monospace; }
    .font-ui { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="396" height="236" rx="12" fill="url(#foodieBg)" stroke="#222B3D" stroke-width="1.5" />
  <rect x="2" y="2" width="396" height="4" rx="2" fill="url(#foodieGlow)" />

  <!-- Icon & Header -->
  <circle cx="36" cy="38" r="18" fill="#2A1E24" stroke="#FF9E3B" stroke-width="1" />
  <text x="36" y="44" font-size="18" text-anchor="middle">🍔</text>

  <text x="64" y="34" class="font-ui" font-size="16" font-weight="bold" fill="#F8FAFC">FoodieFind</text>
  <text x="64" y="48" class="font-code" font-size="10.5" fill="#FF9E3B">RESTAURANT &amp; DISCOVERY APP</text>

  <!-- Status Pill -->
  <rect x="310" y="26" width="70" height="20" rx="10" fill="#1A3326" stroke="#73DACA" stroke-width="0.8" />
  <text x="345" y="40" class="font-code" font-size="9.5" font-weight="bold" fill="#73DACA" text-anchor="middle">ONLINE</text>

  <!-- Description -->
  <text x="20" y="80" class="font-ui" font-size="11.5" fill="#A9B1D6">
    Modern food exploration platform designed for seamless
  </text>
  <text x="20" y="98" class="font-ui" font-size="11.5" fill="#A9B1D6">
    restaurant discovery with lightning-fast search &amp; filtering.
  </text>

  <!-- Tech Badges -->
  <g transform="translate(20, 118)">
    <rect x="0" y="0" width="60" height="22" rx="5" fill="#1C2536" stroke="#61DAFB" stroke-width="0.8" />
    <text x="30" y="15" class="font-code" font-size="10" fill="#61DAFB" font-weight="bold" text-anchor="middle">React</text>

    <rect x="68" y="0" width="85" height="22" rx="5" fill="#1C2536" stroke="#F7DF1E" stroke-width="0.8" />
    <text x="110" y="15" class="font-code" font-size="10" fill="#F7DF1E" font-weight="bold" text-anchor="middle">JavaScript</text>

    <rect x="161" y="0" width="75" height="22" rx="5" fill="#1C2536" stroke="#38BDF8" stroke-width="0.8" />
    <text x="198" y="15" class="font-code" font-size="10" fill="#38BDF8" font-weight="bold" text-anchor="middle">Tailwind</text>

    <rect x="244" y="0" width="65" height="22" rx="5" fill="#1C2536" stroke="#FFFFFF" stroke-width="0.8" />
    <text x="276" y="15" class="font-code" font-size="10" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Vercel</text>
  </g>

  <!-- Highlights Box -->
  <rect x="20" y="152" width="360" height="34" rx="6" fill="#141C2B" stroke="#222B3D" stroke-width="1" />
  <text x="30" y="173" class="font-code" font-size="10" fill="#73DACA">⚡ Sub-second page loads</text>
  <text x="195" y="173" class="font-code" font-size="10" fill="#BB9AF7">📱 100% Responsive UI</text>

  <!-- Footer Actions -->
  <g transform="translate(20, 198)">
    <rect x="0" y="0" width="165" height="28" rx="6" fill="url(#btnGrad)" />
    <text x="82" y="18" class="font-ui" font-size="11" font-weight="bold" fill="#0B0F17" text-anchor="middle">🚀 Live Demo ↗</text>

    <rect x="180" y="0" width="180" height="28" rx="6" fill="#1C2433" stroke="#7AA2F7" stroke-width="0.8" />
    <text x="270" y="18" class="font-ui" font-size="11" font-weight="bold" fill="#7AA2F7" text-anchor="middle">📂 View Repository</text>
  </g>
</svg>
